  <title>Finalizar compra · Suplementos Deportivos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="brand-row">
        <div class="brand">Suplemen<strong>TOPS</strong></div>
      </div>
    </div>
  </header>
  <main class="page">
    <h1 class="page-title">Finalizar compra</h1>

  <div class="checkout-wrap">
    <div class="checkout-card">
      <h2>Resumen del pedido</h2>
      <div class="checkout-summary" id="summary"></div>
      <div class="total-big" id="total"></div>

      <hr style="margin:16px 0;border:none;border-top:1px solid #eee" />

      <form id="checkout-form">
        <div class="field">
          <label>Nombre completo *</label>
          <input id="f-nombre" required autocomplete="name" />
        </div>

        <div class="field">
          <label>Dirección *</label>
          <textarea id="f-direccion" required placeholder="Calle, número, colonia/barrio, referencia..."></textarea>
        </div>

        <div class="field">
          <label>Ubicación en mapa (opcional, como en WhatsApp)</label>
          <button type="button" class="btn btn-secondary location-btn" id="btn-ubicacion">
            <svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> Compartir ubicación
          </button>
          <div class="loc-info" id="loc-info"></div>
        </div>

        <div class="field">
          <label>Número de teléfono *</label>
          <input id="f-telefono" type="tel" required autocomplete="tel" placeholder="+56 9 1234 5678" />
        </div>

        <div class="field">
          <label>Número alternativo (opcional)</label>
          <input id="f-telefono_alt" type="tel" autocomplete="tel" placeholder="+56 9 0000 0000" />
        </div>

        <div class="field">
          <label>Nota / instrucciones (opcional)</label>
          <textarea id="f-nota" placeholder="Por ejemplo: entregar después de las 6pm..."></textarea>
        </div>

        <p class="required-note">* Campos obligatorios. Solo el número alternativo y la nota son opcionales.</p>

        <div class="modal-actions">
          <a href="index.html" class="btn btn-ghost">Seguir viendo</a>
          <button type="submit" class="btn btn-primary" id="btn-submit">Confirmar y enviar orden</button>
        </div>
      </form>
    </div>
  </div>
  </main>

  <script src="app.js"></script>
  <script src="cart.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
