  <title>Producto · Suplementos Deportivos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="brand-row">
        <div class="brand">Suplemen<strong>TOPS</strong></div>
      </div>
    </div>
  </header>
  <main class="page">
    <h1 class="page-title">Detalle del producto</h1>

  <div class="alert info hidden" id="alert"></div>

  <div class="product-detail">
    <div id="detail"></div>

    <section class="related" id="related">
      <h2>Productos que te pueden interesar</h2>
      <div class="grid" id="related-grid"></div>
    </section>
  </div>
  </main>

  <button class="cart-fab" id="cart-fab" aria-label="Carrito"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="badge-count zero" id="cart-count">0</span></button>
  <div class="cart-overlay" id="cart-overlay"></div>
  <aside class="cart-panel" id="cart-panel">
    <div class="cart-panel-head">
      <span>Tu carrito</span>
      <button class="cart-close" id="cart-close" aria-label="Cerrar">×</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-panel-foot">
      <div class="cart-total-row"><span>Total</span><span id="cart-total">$0.00</span></div>
      <button class="btn btn-primary" id="cart-checkout">Comprar</button>
    </div>
  </aside>

  <script src="app.js"></script>
  <script src="cart.js"></script>
  <script src="producto.js"></script>
</body>
</html>
